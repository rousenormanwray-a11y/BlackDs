name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blvkdot
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Setup environment
        run: |
          cp .env.example .env
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/blvkdot" >> .env
          echo "API_JWT_SECRET=test-secret-key" >> .env
          echo "CORS_ORIGIN=http://localhost:3000" >> .env
          echo "NEXT_PUBLIC_API_BASE_URL=http://localhost:4000/api" >> .env

      - name: Generate Prisma client
        run: pnpm --filter api prisma generate

      - name: Setup DB schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blvkdot
        run: |
          pnpm --filter api prisma migrate deploy
          pnpm --filter api prisma db seed

      - name: Lint
        run: pnpm lint

      - name: Backend Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blvkdot
          API_JWT_SECRET: test-secret-key
          CORS_ORIGIN: http://localhost:3000
        run: pnpm --filter api test

      - name: Frontend Tests
        run: pnpm --filter web test -- --run

      - name: Build apps
        run: pnpm build

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
